<!DOCTYPE html>
<html lang="ms">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b0d45">
<title>Pengurusan Kokurikulum Sekolah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --p:#3b0d45; --p2:#5b1d6b; --pt:#fff;
  --bg:#f6f7fb; --card:#fff; --tx:#1f2330; --mut:#6b7280; --bd:#e6e8ef; --soft:#f2f3f7;
  --sb:#1b1c21; --sb2:#26272e; --sbtx:#c5c8d1; --sbmut:#7c808c;
  --ok:#10b981; --bad:#e11d48; --warn:#f59e0b; --info:#0ea5e9; --vio:#8b5cf6;
  --r:14px; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#171a21; --tx:#e7e9ee; --mut:#9aa1ad; --bd:#272b35; --soft:#1e222b;
  --sb:#0b0c0f; --sb2:#181a20;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh}
#sb{width:250px;flex:0 0 250px;background:var(--sb);color:var(--sbtx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;margin:10px;padding:10px;border-radius:12px;background:var(--sb2)}
.brand img{width:30px;height:30px;object-fit:contain}
.brand .bi{width:30px;height:30px;border-radius:8px;background:var(--p);display:grid;place-items:center;color:#fff}
.brand b{display:block;color:#fff;font-size:13px;line-height:1.2;text-transform:uppercase}
.brand small{font-size:10.5px;color:var(--sbmut)}
.sbsearch{margin:2px 10px 10px;position:relative}
.sbsearch input{width:100%;background:transparent;border:1px solid #3a3c45;border-radius:9px;padding:9px 60px 9px 32px;color:#fff;outline:none}
.sbsearch input:focus{border-color:#777}
.sbsearch i{position:absolute;left:11px;top:11px;color:var(--sbmut);font-size:12px}
.sbsearch kbd{position:absolute;right:8px;top:7px;font-size:10px;background:#2e3038;border-radius:5px;padding:3px 6px;color:var(--sbmut);font-family:inherit}
#srch{position:absolute;left:0;right:0;top:42px;background:var(--card);color:var(--tx);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-height:360px;overflow:auto;z-index:60}
#srch a{display:flex;gap:10px;padding:9px 12px;text-decoration:none;border-bottom:1px solid var(--bd);cursor:pointer;font-size:13px}
#srch a:hover,#srch a.on{background:var(--soft)}
#srch small{color:var(--mut);display:block;font-size:11px}
nav{flex:1;overflow:auto;padding:0 10px}
.navh{font-size:10px;letter-spacing:.06em;color:var(--sbmut);font-weight:600;margin:12px 8px 6px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--sbtx);font-size:13.5px;font-weight:500;position:relative;margin-bottom:2px;user-select:none}
.ni i.ic{width:16px;text-align:center;font-size:13px;opacity:.85}
.ni:hover{background:var(--sb2);color:#fff}
.ni.on{background:var(--sb2);color:#fff;font-weight:600}
.ni.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#f59e0b}
.ni .chev{margin-left:auto;font-size:10px;width:20px;height:20px;border-radius:6px;background:#2c2e36;display:grid;place-items:center;transition:transform .2s}
.ni.open .chev{transform:rotate(90deg)}
.sub{margin:0 0 4px 22px;display:none}
.sub.open{display:block}
.sub .ni{font-size:12.5px;padding:7px 10px}
.sub .ni.on::before{left:-4px}
.sbfoot{padding:10px;border-top:1px solid #2a2c33}
.ni.guide{border:1px solid #1f6b4a;background:rgba(16,185,129,.08);color:#34d399}
.ni.guide:hover{background:rgba(16,185,129,.15);color:#6ee7b7}
.ubox{display:flex;align-items:center;gap:9px;padding:9px 6px 2px}
.av{width:28px;height:28px;border-radius:50%;background:#e5e7eb;color:#111;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 28px}
.ubox b{display:block;color:#fff;font-size:12.5px}
.ubox small{font-size:10.5px;color:var(--sbmut)}
.ubox .ib{margin-left:auto}
.ib{width:28px;height:28px;border-radius:8px;border:1px solid #3a3c45;background:transparent;color:var(--sbtx);cursor:pointer;display:inline-grid;place-items:center;font-size:12px}
.ib:hover{background:#2c2e36}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#tb{height:46px;background:linear-gradient(90deg,#16121d, var(--p) 60%, var(--p2));color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;position:sticky;top:0;z-index:30}
#tb h1{font-size:14.5px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbb{height:30px;min-width:30px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 9px;font-size:12px;font-weight:600;position:relative}
.tbb:hover{background:rgba(255,255,255,.16)}
.tbb .dot{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:#f43f5e}
body.sbmini #sb{display:none}
#pg{padding:26px 28px 90px;max-width:1240px;width:100%;margin:0 auto}

/* ---------- KOMPONEN ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.ph{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph .phi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#fff4e6;color:#ea7a12;font-size:15px;border:1px solid #fde2c3}
:root[data-theme="dark"] .ph .phi{background:#2a1f12;border-color:#4a3218}
.ph h2{margin:0;font-size:17px;font-weight:700}
.ph p{margin:3px 0 0;color:var(--mut);font-size:12.5px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--p);border-color:var(--p);color:var(--pt)}
.btn.pri:hover{filter:brightness(1.15)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn[disabled]{opacity:.5;pointer-events:none}
.icb{width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--mut);display:inline-grid;place-items:center}
.icb:hover{background:var(--soft);color:var(--tx)}
.icb.del:hover{color:var(--bad)}
.fab{position:fixed;right:22px;bottom:22px;z-index:25;border-radius:999px;padding:12px 18px;box-shadow:0 8px 24px rgba(59,13,69,.35)}
label.l{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0 0 5px}
label.l i{margin-right:4px;color:var(--p)}
:root[data-theme="dark"] label.l i{color:#c084fc}
.in,select.in,textarea.in{width:100%;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 11px;outline:none;font-size:13px}
.in:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 15%,transparent)}
textarea.in{min-height:80px;resize:vertical}
.in[readonly]{background:var(--soft);color:var(--mut)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mb{margin-bottom:16px}.mt{margin-top:16px}
.mut{color:var(--mut)}.sm{font-size:12px}
.stat{display:flex;gap:12px;align-items:center;padding:14px 16px}
.stat .si{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:14px;flex:0 0 36px}
.stat small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.stat b{font-size:20px;font-weight:800}
.c-blue{background:#e8f1ff;color:#2563eb}.c-green{background:#e6f8f0;color:#059669}.c-vio{background:#f1eaff;color:#7c3aed}
.c-orange{background:#fff1e6;color:#ea580c}.c-pink{background:#ffe8ef;color:#e11d48}.c-teal{background:#e0f7f6;color:#0d9488}.c-amber{background:#fff7e0;color:#d97706}
:root[data-theme="dark"] .stat .si,:root[data-theme="dark"] .bdg{filter:brightness(.85) saturate(1.2)}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap}
.bdg.ok{background:#dcfce7;color:#15803d}.bdg.bad{background:#ffe4e6;color:#be123c}.bdg.warn{background:#fef3c7;color:#b45309}
.bdg.info{background:#e0f2fe;color:#0369a1}.bdg.vio{background:#ede9fe;color:#6d28d9}
.tabs{display:inline-flex;gap:4px;background:var(--soft);border:1px solid var(--bd);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs.full{display:flex}
.tabs.full .tab{flex:1;justify-content:center}
.tab{border:0;background:transparent;padding:8px 13px;border-radius:9px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--mut);display:inline-flex;align-items:center;gap:7px}
.tab.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.tab .n{font-size:10px;background:#fef3c7;color:#b45309;border-radius:999px;padding:1px 7px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--card);padding:7px 12px;border-radius:10px;font-weight:600;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:11px 12px;border-bottom:1px solid var(--bd);background:var(--soft);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}
.t td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
.t tr:hover td{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.t .c{text-align:center}
.t td b{font-weight:600}
.tw{overflow:auto;max-height:70vh;border-radius:var(--r)}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
.empty i{font-size:26px;opacity:.5;display:block;margin-bottom:8px}
.spin{width:28px;height:28px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.acc{margin-bottom:10px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;font-weight:700;font-size:12.5px;letter-spacing:.02em;text-transform:uppercase}
.acc-h .chev{margin-left:auto;color:var(--mut);transition:transform .2s}
.acc.open .acc-h .chev{transform:rotate(180deg)}
.acc-b{display:none;padding:0 16px 16px}
.acc.open .acc-b{display:block}
.ucard{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:11px;padding:11px 12px;cursor:pointer;background:var(--card)}
.ucard:hover{border-color:var(--p)}
.ucard .ua{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800}
.ucard small{display:block;color:var(--mut);font-size:11px}
.mark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:700}
.mark.y{background:#dcfce7;color:#16a34a}.mark.n{background:#ffe4e6;color:#e11d48}.mark.x{color:var(--mut)}
.hero{border-radius:18px;padding:22px;color:#fff;background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 14px,transparent 14px 28px),
  linear-gradient(135deg,#2a0b33,var(--p) 45%,#1b0b22);box-shadow:0 14px 30px rgba(59,13,69,.25);display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center}
.hero h3{margin:0;font-size:11px;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.donut{position:relative;width:150px;height:150px;margin:auto}
.donut .dc{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut b{font-size:30px;font-weight:800;display:block;line-height:1}
.donut small{font-size:10px;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
.hrow{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.hrow .row{justify-content:space-between}
.hrow .bar{background:rgba(255,255,255,.1);margin-top:8px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.12)}
.kcard{padding:16px;position:relative;overflow:hidden}
.kcard .tag{position:absolute;right:12px;top:12px}
.kcard h4{margin:12px 0 2px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
.kcard .big{font-size:26px;font-weight:800}
.kcard.sel{background:linear-gradient(135deg,#3a0f45,var(--p));color:#fff;border-color:transparent}
.kcard.clk{cursor:pointer}
.kcard.clk:hover{transform:translateY(-1px)}
.ecard{padding:16px;display:flex;flex-direction:column;gap:6px}
.ecard h4{margin:6px 0 0;font-size:14px}
.ecard .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--bd);padding-top:10px;margin-top:auto}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mut);align-items:center;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.chk{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--bd);border-radius:9px;cursor:pointer;font-size:12.5px;background:var(--card)}
.chk input{accent-color:var(--p);width:16px;height:16px}
.chk.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.swatch{width:40px;height:40px;border-radius:10px;cursor:pointer;border:3px solid transparent;display:inline-grid;place-items:center;color:#fff}
.swatch.on{border-color:var(--ok);box-shadow:0 0 0 2px var(--card) inset}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;cursor:pointer;color:var(--mut)}
.drop:hover{border-color:var(--p)}

/* ---------- MODAL / TOAST / LOADING ---------- */
.ov{position:fixed;inset:0;background:rgba(15,17,25,.55);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.md{background:var(--card);border-radius:18px;width:100%;max-width:640px;box-shadow:0 25px 60px rgba(0,0,0,.35);animation:pop .18s ease-out}
.md.lg{max-width:900px}.md.sm{max-width:420px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.md-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--bd)}
.md-h h3{margin:0;font-size:15px;flex:1}
.md-b{padding:18px;max-height:calc(100vh - 220px);overflow:auto}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--bd)}
#login .md{max-width:380px;margin-top:8vh}
.lg-ic{width:52px;height:52px;border-radius:14px;border:1px solid var(--bd);display:grid;place-items:center;margin:6px auto 12px;font-size:22px;color:#10b981;box-shadow:var(--sh)}
#toasts{position:fixed;top:56px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ok);padding:11px 14px;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.15);font-size:13px;font-weight:600;max-width:340px;animation:pop .2s}
.toast.bad{border-left-color:var(--bad)}.toast.info{border-left-color:var(--info)}
#busy{position:fixed;inset:0;background:rgba(15,17,25,.55);backdrop-filter:blur(4px);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#busy .ring{width:38px;height:38px;border:3px solid rgba(255,255,255,.25);border-top-color:#34d399;border-radius:50%;animation:sp .8s linear infinite}
#busy span{background:#fff;color:#111;font-weight:700;font-size:12.5px;padding:9px 16px;border-radius:999px}
#blocker{position:fixed;inset:0;z-index:35}

/* ---------- RESPONSIF ---------- */
@media (max-width:1000px){.g5,.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  #sb{position:fixed;left:0;top:0;transform:translateX(-100%)}
  body.sbopen #sb{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #pg{padding:18px 16px 90px}
  .hero{grid-template-columns:1fr}
  .g2,.g3,.gf{grid-template-columns:1fr!important}
  .ph .act{margin-left:0}
  .tbb .tx{display:none}
}
@media (max-width:520px){.g4,.g5,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs.full{display:grid}}
@media print{#sb,#tb,.fab,.noprint{display:none!important}#pg{padding:0}}
</style>
</head>
<body>
<div id="app">
  <aside id="sb">
    <div class="brand" id="brand"></div>
    <div class="sbsearch">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="q" placeholder="Carian pantas..." autocomplete="off">
      <kbd>Ctrl+K</kbd>
      <div id="srch" class="hide"></div>
    </div>
    <nav id="nav"></nav>
    <div class="sbfoot">
      <div class="ni guide" onclick="App.guide()"><i class="ic fa-solid fa-book-open"></i>Panduan Penggunaan<i class="fa-solid fa-arrow-up-right-from-square" style="margin-left:auto;font-size:10px"></i></div>
      <div class="ni" data-p="admin" id="navAdmin" onclick="App.go('admin')"><i class="ic fa-solid fa-gear"></i>Pengurusan &amp; Admin</div>
      <div class="ubox" id="ubox"></div>
    </div>
  </aside>
  <div id="main">
    <header id="tb">
      <button class="tbb" style="border:0;background:transparent" onclick="App.toggleSb()"><i class="fa-solid fa-bars"></i></button>
      <h1 id="title">Dashboard</h1>
      <button class="tbb" onclick="App.guide()"><i class="fa-solid fa-book-open" style="color:#34d399"></i><span class="tx">Panduan Penggunaan</span></button>
      <button class="tbb" onclick="App.toggleTheme()" title="Mod gelap/terang"><i id="thIc" class="fa-solid fa-moon"></i></button>
      <button class="tbb" onclick="App.notif()" title="Notifikasi"><i class="fa-regular fa-bell"></i><span class="dot hide" id="ndot"></span></button>
      <button class="tbb" onclick="App.userMenu()" title="Pengguna"><i class="fa-regular fa-user"></i></button>
    </header>
    <div id="pg"></div>
  </div>
</div>
<div id="toasts"></div>
<div id="modals"></div>
<input type="file" id="fileIn" class="hide">
<script>
/* =========================================================
   SISTEM PENGURUSAN KOKURIKULUM SEKOLAH — teras
   Mod 1: Google Apps Script (google.script.run → Google Sheet)
   Mod 2: Fail HTML biasa (data dalam localStorage pelayar)
   ========================================================= */
const GAS = typeof google !== 'undefined' && google.script && google.script.run;
const LS_KEY = 'koko_db_v1';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function toast(msg, type = 'ok') {

function busy(msg) {
  let b = $('#busy');

  if (!b) { b = document.createElement('div'); b.id = 'busy'; document.body.appendChild(b); }
  b.innerHTML = `<div class="ring"></div><span>${esc(msg || 'Sedang diproses... Sila tunggu')}</span>`;
}
function modal(title, body, foot = '', size = '') {
  const id = 'm' + uid();

  w.addEventListener('mousedown', e => { if (e.target === w) closeM(id); });
  $('#modals').appendChild(w);
  return id;
}
function closeM(id) { if (id) { const e = document.getElementById(id); e && e.remove(); } else { const all = $$('#modals .ov'); all.length && all[all.length - 1].remove(); } }
function confirmBox(msg, yes = 'Ya, Teruskan', danger = true) {

function gas(fn, ...args) {
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](...args));
}
const DB = {
  async load() {
    if (GAS) return JSON.parse(await gas('apiLoad'));

  },
  local() { if (!GAS && !ls.set(LS_KEY, JSON.stringify(S.d))) toast('Storan pelayar tidak tersedia — data tidak kekal.', 'bad'); },
  async run(fn, msg) {
    busy(msg); try { await fn(); return true; } catch (e) { toast((e && e.message) || 'Ralat pelayan', 'bad'); console.error(e); return false; } finally { busy(false); }
  },
  async put(col, rec, msg) {
    return this.run(async () => {
      if (GAS) await gas('apiSave', S.token, col, JSON.stringify(rec));
      const a = S.d[col]; const i = a.findIndex(x => x.id === rec.id); if (i >= 0) a[i] = rec; else a.push(rec);

    }, msg);
  },
  async putMany(col, recs, msg) {
    return this.run(async () => {
      if (GAS) await gas('apiSaveMany', S.token, col, JSON.stringify(recs));
      recs.forEach(rec => { const a = S.d[col]; const i = a.findIndex(x => x.id === rec.id); if (i >= 0) a[i] = rec; else a.push(rec); });

function kehadiranMurid(m, kats = ['BB', 'KP', 'SP']) {
  let h = 0, t = 0;
  kats.forEach(k => { const u = m.unit && m.unit[k]; if (!u) return; pjUnit(u).forEach(p => { t++; if ((p.hadir || []).includes(m.id)) h++; }); });
  return { h, t, p: t ? h / t : 0 };
}
function pencapaianMurid(m) {
  const out = [];
  S.d.program.forEach(p => (p.peserta || []).forEach(x => { if (x.muridId === m.id) out.push({ nama: p.nama, peringkat: p.peringkat, kedudukan: x.kedudukan || 'Penyertaan', tarikh: p.tarikh, kat: p.kat, sumber: 'Program', pid: p.id }); }));
  S.d.pencapaian.filter(x => x.muridId === m.id).forEach(x => out.push({ nama: x.nama, peringkat: x.peringkat, kedudukan: x.kedudukan, tarikh: x.tarikh, kat: x.kat, sumber: 'Rekod', rid: x.id }));
  return out;
}
function skor(m, kats) {
  const M = S.d.settings.markah;
  const kh = kehadiranMurid(m, kats || ['BB', 'KP', 'SP']);
  const kehadiran = Math.round(kh.p * M.kehadiran * 10) / 10;
  const jws = S.d.jawatan.filter(j => j.muridId === m.id && (!kats || kats.includes((unitById(j.unitId) || {}).kat)));
  let jawatan = jws.reduce((mx, j) => Math.max(mx, M.jawatan[j.jawatan] || 0), 0);
  const inUnit = (kats || ['BB', 'KP', 'SP']).some(k => m.unit && m.unit[k]);
  if (!jawatan && inUnit) jawatan = M.jawatan['Ahli'] || 0;
  let pc = pencapaianMurid(m); if (kats) pc = pc.filter(x => kats.includes(x.kat));
  const pencapaian = Math.min(M.maxPencapaian, pc.reduce((mx, x) => Math.max(mx, (M.peringkat[x.peringkat] || 0) * (M.kedudukan[x.kedudukan] || 0)), 0));
  const progs = new Set(pc.filter(x => x.pid).map(x => x.pid)).size;
  const program = Math.min(M.maxProgram, progs * M.perProgram);
  const eks = S.d.ekstra.filter(e => (e.murid || []).includes(m.id)).length;
  const ekstra = kats ? 0 : Math.min(M.maxEkstra, eks * M.perEkstra);
  const jumlah = Math.round((kehadiran + jawatan + pencapaian + program + ekstra) * 10) / 10;
  return { kehadiran, jawatan, pencapaian: Math.round(pencapaian * 10) / 10, program, ekstra, jumlah, kh, pc, jws, eks, progs };
}

function initSearch() {
  const q = $('#q'), box = $('#srch'); let sel = 0, items = [];
  const run = () => {
    const s = q.value.trim().toLowerCase();
    if (!s) { box.classList.add('hide'); return; }
    items = [];
    Object.entries(TITLES).forEach(([p, t]) => { if (t.toLowerCase().includes(s) && (p !== 'admin' || isAdmin())) items.push({ ic: 'fa-arrow-right', t, s: 'Halaman', f: () => App.go(p) }); });
    S.d.murid.filter(m => m.nama.toLowerCase().includes(s) || String(m.ic).includes(s)).slice(0, 8).forEach(m => items.push({ ic: 'fa-user-graduate', t: m.nama, s: `Murid • ${kelasM(m)} • ${m.ic}`, f: () => profilMurid(m.id) }));
    S.d.unit.filter(u => u.nama.toLowerCase().includes(s)).slice(0, 5).forEach(u => items.push({ ic: KAT[u.kat].ic, t: u.nama, s: 'Unit • ' + KAT[u.kat].nama, f: () => { S.st.lapUnit = u.id; App.go('laporan'); } }));
    S.d.program.filter(p => p.nama.toLowerCase().includes(s)).slice(0, 5).forEach(p => items.push({ ic: 'fa-calendar-days', t: p.nama, s: `Program • ${p.peringkat} • ${fmtD(p.tarikh)}`, f: () => lihatProgram(p.id) }));
    S.d.guru.filter(g => g.nama.toLowerCase().includes(s)).slice(0, 4).forEach(g => items.push({ ic: 'fa-chalkboard-user', t: g.nama, s: 'Guru', f: () => { if (isAdmin()) { S.st.admTab = 'guru'; App.go('admin'); } } }));
    sel = 0; draw();
  };
  const draw = () => {
    box.classList.remove('hide');
    box.innerHTML = items.length ? items.map((it, i) => `<a class="${i === sel ? 'on' : ''}" data-i="${i}"><i class="fa-solid ${it.ic}" style="margin-top:3px;color:var(--mut)"></i><span>${esc(it.t)}<small>${esc(it.s)}</small></span></a>`).join('') : `<div class="empty" style="padding:16px">Tiada padanan</div>`;
    box.querySelectorAll('a').forEach(a => a.onmousedown = e => { e.preventDefault(); pickIt(+a.dataset.i); });
  };
  const pickIt = i => { const it = items[i]; if (!it) return; q.value = ''; box.classList.add('hide'); q.blur(); it.f(); };
  q.addEventListener('input', run);
  q.addEventListener('blur', () => setTimeout(() => box.classList.add('hide'), 150));
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') pickIt(sel);
    else if (e.key === 'Escape') { q.value = ''; box.classList.add('hide'); q.blur(); }
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (innerWidth <= 820) document.body.classList.add('sbopen'); q.focus(); }
    if (e.key === 'Escape' && !$('#login')) { const all = $$('#modals .ov'); if (all.length) all[all.length - 1].remove(); }
  });
}

async function boot() {

  S.d = normalize(d);
  applyTheme(); initSearch();
  const sess = ss.get('koko_sess');
  if (sess) { try { const o = JSON.parse(sess); S.user = o.user; S.token = o.token; } catch (e) {} }
  App.go('utama');
  if (!S.user) showLogin();
  else if (GAS && S.d._empty && isAdmin()) toast('Pangkalan data kosong. Pergi ke Setup > Sandaran Data untuk mula.', 'info');
}

<script>
const Pages = {};
const unitSelect = (id, sel, kats = ['BB', 'KP', 'SP', 'RS'], first = '-- Pilih Unit --', onch = '') =>
  `<select class="in" id="${id}" ${onch ? `onchange="${onch}"` : ''}><option value="">${first}</option>${kats.map(k => `<optgroup label="${KAT[k].nama}">${unitsOf(k).map(u => opt(u.id, u.nama, sel)).join('')}</optgroup>`).join('')}</select>`;

/* ==================== UTAMA ==================== */
Pages.utama = () => {
  const d = S.d, M = d.murid, L = M.filter(m => m.jantina === 'Lelaki').length, P = M.length - L;
  const r = 60, C = 2 * Math.PI * r, lp = M.length ? L / M.length : 0;
  const medals = d.program.reduce((n, p) => n + (p.peserta || []).filter(x => ['Johan', 'Naib Johan', 'Ketiga'].includes(x.kedudukan)).length, 0) + d.pencapaian.filter(x => ['Johan', 'Naib Johan', 'Ketiga'].includes(x.kedudukan)).length;
  const k = S.st.dashKat || 'SP';
  const units = unitsOf(k);
  const maxN = Math.max(1, ...units.map(u => ahliUnit(u.id).length));
  const byThn = d.settings.tahun.map(t => ({ t, n: M.filter(m => m.tahun === t).length })).filter(x => x.n);
  const recent = d.perjumpaan.slice().sort((a, b) => String(b.tarikh).localeCompare(a.tarikh)).slice(0, 5);
  const upcoming = d.program.filter(p => p.tarikh >= today()).sort((a, b) => a.tarikh.localeCompare(b.tarikh)).slice(0, 5);
  return `
  <div class="hero mb">

  ${pj.length ? pj.map(p => `<tr><td><span class="bdg vio">#${p.bil}</span></td><td><b>${fmtD(p.tarikh)}</b><div class="mut" style="font-size:11px">${esc(p.masa || '')}</div></td><td style="max-width:320px">${esc(p.aktiviti)}<div class="mut" style="font-size:11px">${esc(p.tempat || '')}</div></td>

function formLaporan(unitId, pid) {

  const ahli = ahliUnit(unitId).sort(sortNama), pj = pjUnit(unitId);

    <div class="grid g3 mb"><div><label class="l">Perjumpaan Ke-</label><input class="in" id="f_bil" type="number" min="1" value="${p ? p.bil : (pj.length ? Math.max(...pj.map(x => x.bil || 0)) + 1 : 1)}"></div>

      <select class="in" style="margin-top:8px" onchange="if(this.value){const g=guruById(this.value);$('#f_guru').insertAdjacentHTML('beforeend','<label class=&quot;chk on&quot;><input type=&quot;checkbox&quot; checked value=&quot;'+g.id+'&quot;>'+esc(g.nama)+'</label>');this.value=''}"><option value="">+ Tambah guru lain</option>${S.d.guru.slice().sort(sortNama).map(g => opt(g.id, g.nama)).join('')}</select></div>

    <div class="grid g2" id="f_murid" onchange="$('#f_cnt').textContent=$$('#f_murid input:checked').length">${ahli.map(m => `<label class="chk ${hadir.has(m.id) ? 'on' : ''}"><input type="checkbox" value="${m.id}" ${hadir.has(m.id) ? 'checked' : ''} onchange="this.parentNode.classList.toggle('on',this.checked)"><span style="min-width:0"><span style="display:block;font-size:12px;font-weight:600">${esc(m.nama)}</span><span class="mut" style="font-size:10.5px">${kelasM(m)}</span></span></label>`).join('') || '<span class="mut sm">Tiada ahli dalam unit ini.</span>'}</div>`,

      guruHadir: [...new Set($$('#f_guru input:checked').map(i => i.value))], hadir: $$('#f_murid input:checked').map(i => i.value), updated: Date.now()

function tandaSemua(sel, on) { $$(sel + ' input').forEach(i => { i.checked = on; i.parentNode.classList.toggle('on', on); }); const c = $('#f_cnt'); c && (c.textContent = $$(sel + ' input:checked').length); }

Pages.kehadiran = () => {
  const uidSel = S.st.khUnit || '', u = unitById(uidSel);
  const pj = u ? pjUnit(u.id) : [];
  const pid = S.st.khPj && pj.find(p => p.id === S.st.khPj) ? S.st.khPj : (pj.length ? pj[pj.length - 1].id : '');
  const p = pj.find(x => x.id === pid);
  const ahli = u ? ahliUnit(u.id).sort(sortNama) : [];
  const h = new Set(p ? p.hadir || [] : []);
  return `<div class="ph"><span class="phi"><i class="fa-solid fa-clipboard-user"></i></span><div><h2>Kehadiran Perjumpaan Mingguan</h2><p>Rekod kehadiran murid bagi setiap perjumpaan unit kokurikulum</p></div></div>
  <div class="card pad mb"><div class="grid g2"><div><label class="l"><i class="fa-solid fa-layer-group"></i>Pilih Unit Kokurikulum</label>${unitSelect('khU', uidSel, ['BB', 'KP', 'SP', 'RS'], '-- Pilih Unit --', "S.st.khUnit=this.value;S.st.khPj='';App.refresh()")}</div>
    <div><label class="l"><i class="fa-solid fa-calendar"></i>Perjumpaan</label><div class="row" style="flex-wrap:nowrap"><select class="in" ${!u ? 'disabled' : ''} onchange="S.st.khPj=this.value;App.refresh()">${pj.length ? pj.map(x => opt(x.id, `Perjumpaan #${x.bil} — ${fmtD(x.tarikh)}`, pid)).join('') : '<option>Tiada perjumpaan</option>'}</select>
      ${u && canEdit() ? `<button class="btn pri" onclick="formLaporan('${u.id}')"><i class="fa-solid fa-plus"></i> Baharu</button>` : ''}</div></div></div></div>
  ${!u ? `<div class="card">${empty('Sila pilih unit untuk merekod kehadiran.', 'fa-hand-pointer')}</div>` : !p ? `<div class="card">${empty('Unit ini belum ada perjumpaan. Klik <b>Baharu</b> untuk mencipta laporan perjumpaan pertama.', 'fa-calendar-plus')}</div>` : `
  <div class="grid g4 mb">
    <div class="card stat"><span class="si c-blue"><i class="fa-solid fa-users"></i></span><div><small>Ahli</small><b>${ahli.length}</b></div></div>
    <div class="card stat"><span class="si c-green"><i class="fa-solid fa-check"></i></span><div><small>Hadir</small><b id="khH">${h.size}</b></div></div>
    <div class="card stat"><span class="si c-pink"><i class="fa-solid fa-xmark"></i></span><div><small>Tidak Hadir</small><b id="khT">${ahli.length - h.size}</b></div></div>
    <div class="card stat"><span class="si c-amber"><i class="fa-solid fa-percent"></i></span><div><small>Peratus</small><b id="khP">${pct(h.size, ahli.length)}%</b></div></div>
  </div>
  <div class="card"><div class="row pad" style="justify-content:space-between;border-bottom:1px solid var(--bd)"><div><b>${esc(p.aktiviti)}</b><div class="mut sm">${fmtD(p.tarikh)} • ${esc(p.masa || '')} • ${esc(p.tempat || '')}</div></div>
    ${canEdit() ? `<div class="row"><button class="btn sm" onclick="khSemua(true)">Semua Hadir</button><button class="btn sm" onclick="khSemua(false)">Semua Tidak</button><button class="btn pri" onclick="simpanKh('${p.id}')"><i class="fa-solid fa-floppy-disk"></i> Simpan Kehadiran</button></div>` : ''}</div>
  <div class="tw"><table class="t"><thead><tr><th>Bil</th><th>Nama Murid</th><th>Kelas</th><th class="c">Status</th></tr></thead><tbody id="khRows">
  ${ahli.map((m, i) => `<tr><td>${i + 1}</td><td><b>${esc(m.nama)}</b><div class="mut" style="font-size:11px">${esc(m.ic)} • ${esc(m.jantina)}</div></td><td>${kelasM(m)}</td>
    <td class="c"><div class="tabs" style="padding:3px" data-m="${m.id}" data-h="${h.has(m.id) ? 1 : 0}"><button class="tab ${h.has(m.id) ? 'on' : ''}" style="padding:5px 10px;color:${h.has(m.id) ? 'var(--ok)' : ''}" onclick="khSet(this,1)"><i class="fa-solid fa-check"></i> Hadir</button><button class="tab ${!h.has(m.id) ? 'on' : ''}" style="padding:5px 10px;color:${!h.has(m.id) ? 'var(--bad)' : ''}" onclick="khSet(this,0)"><i class="fa-solid fa-xmark"></i> Tidak</button></div></td></tr>`).join('')}
  </tbody></table></div></div>`}`;
};
function khSet(btn, v) {
  if (!canEdit()) return needEdit();
  const w = btn.parentNode; w.dataset.h = v; const [a, b] = w.children;
  a.classList.toggle('on', v === 1); b.classList.toggle('on', v === 0); a.style.color = v ? 'var(--ok)' : ''; b.style.color = v ? '' : 'var(--bad)';
  const all = $$('#khRows [data-m]'), n = all.filter(x => x.dataset.h === '1').length;
  $('#khH').textContent = n; $('#khT').textContent = all.length - n; $('#khP').textContent = pct(n, all.length) + '%';
}
function khSemua(v) { $$('#khRows [data-m]').forEach(w => khSet(w.children[v ? 0 : 1], v ? 1 : 0)); }
async function simpanKh(pid) {
  const p = S.d.perjumpaan.find(x => x.id === pid); if (!p) return;
  const rec = Object.assign({}, p, { hadir: $$('#khRows [data-m]').filter(x => x.dataset.h === '1').map(x => x.dataset.m), updated: Date.now() });
  if (await DB.put('perjumpaan', rec, 'Menyimpan kehadiran...')) toast('Kehadiran disimpan.');
}

/* ==================== ANALISIS KEHADIRAN ==================== */
Pages['kehadiran-analisis'] = () => {
  const tab = S.st.anTab || 'murid';
  const head = `<div class="ph"><span class="phi"><i class="fa-solid fa-user-check"></i></span><div><h2>Analisis Kehadiran ${tab === 'murid' ? 'Murid' : 'Guru'}</h2><p>Jadual matriks kehadiran ${tab === 'murid' ? 'murid' : 'guru'} mengikut unit kokurikulum atau kelas</p></div></div>
  <div class="card pad mb row" style="justify-content:space-between"><div class="tabs"><button class="tab ${tab === 'murid' ? 'on' : ''}" onclick="S.st.anTab='murid';App.refresh()"><i class="fa-solid fa-graduation-cap"></i> Analisis Kehadiran Murid</button><button class="tab ${tab === 'guru' ? 'on' : ''}" onclick="S.st.anTab='guru';App.refresh()"><i class="fa-solid fa-chalkboard-user"></i> Analisis Kehadiran Guru</button></div><span class="bdg ok">Mod: Matriks Kehadiran ${tab === 'murid' ? 'Murid' : 'Guru'}</span></div>`;
  return head + (tab === 'murid' ? anMurid() : anGuru());
};
function anMurid() {
  const k = S.st.anKat && S.st.anKat !== 'RS' ? S.st.anKat : 'BB';
  const un = S.st.anUnit && (unitById(S.st.anUnit) || {}).kat === k ? S.st.anUnit : '';
  const kl = S.st.anKelas || '', q = (S.st.anQ || '').toLowerCase();
  let ms = S.d.murid.filter(m => un ? m.unit && m.unit[k] === un : true);
  if (kl) ms = ms.filter(m => `${m.tahun}|${m.kelas}` === kl || m.tahun === kl);
  if (q) ms = ms.filter(m => m.nama.toLowerCase().includes(q) || String(m.ic).includes(q) || ((unitById(m.unit && m.unit[k]) || {}).nama || '').toLowerCase().includes(q));
  ms.sort((a, b) => (a.tahun || '').localeCompare(b.tahun || '') || sortNama(a, b));
  const cols = Math.max(1, ...(un ? [pjUnit(un).length] : unitsOf(k).map(u => pjUnit(u.id).length)));
  let tot = 0, totH = 0, penuh = 0;
  const rows = ms.map((m, i) => {
    const u = unitById(m.unit && m.unit[k]); const pj = u ? pjUnit(u.id) : [];
    let h = 0; const cells = [];
    for (let c = 0; c < cols; c++) { const p = pj[c]; if (!p) cells.push('<td class="c"><span class="mark x">–</span></td>'); else { const y = (p.hadir || []).includes(m.id); if (y) h++; cells.push(`<td class="c"><span class="mark ${y ? 'y' : 'n'}" title="${fmtD(p.tarikh)}">${y ? '✓' : '✗'}</span></td>`); } }
    tot += pj.length; totH += h; if (pj.length && h === pj.length) penuh++;
    return `<tr><td>${i + 1}</td><td style="min-width:220px"><b style="font-size:12px">${esc(m.nama)}</b><div class="mut" style="font-size:10.5px">${esc(m.ic)} • ${esc(m.jantina)}</div></td><td class="c"><span class="bdg">${kelasM(m)}</span></td><td>${u ? `<span class="bdg vio">${esc(u.nama)}</span>` : '<span class="bdg">Tiada Unit</span>'}</td>${cells.join('')}<td class="c">${pj.length ? `<b>${h}/${pj.length}</b> <span class="bdg ${pct(h, pj.length) >= 75 ? 'ok' : 'bad'}">${pct(h, pj.length)}%</span>` : '<i class="mut" style="font-size:11px">Belum direkod</i>'}</td></tr>`;
  });
  const klOpts = S.d.settings.tahun.map(t => `<optgroup label="${esc(t)}">${opt(t, 'Semua ' + t, kl)}${S.d.settings.kelas.map(c => opt(`${t}|${c}`, `${t.replace('Tahun ', '')} ${c}`, kl)).join('')}</optgroup>`).join('');
  return `<div class="card pad mb"><div class="grid gf" style="grid-template-columns:1fr 1.3fr 1fr auto;gap:12px">
    <div><label class="l"><i class="fa-solid fa-shapes"></i>Pilih Jenis</label><select class="in" onchange="S.st.anKat=this.value;S.st.anUnit='';App.refresh()">${['BB', 'KP', 'SP'].map(x => opt(x, KAT[x].nama.toUpperCase(), k)).join('')}</select></div>
    <div><label class="l"><i class="fa-solid fa-layer-group"></i>Pilih Unit</label><select class="in" onchange="S.st.anUnit=this.value;App.refresh()">${opt('', `[Semua Unit - ${k}]`, un)}${unitsOf(k).map(u => opt(u.id, u.nama, un)).join('')}</select></div>
    <div><label class="l"><i class="fa-solid fa-graduation-cap"></i>Tapis Tahun / Kelas</label><select class="in" onchange="S.st.anKelas=this.value;App.refresh()">${opt('', 'Semua Kelas', kl)}${klOpts}</select></div>
    <div style="align-self:end"><button class="btn" style="height:38px" onclick="App.reload()"><i class="fa-solid fa-rotate"></i> Muat Semula</button></div></div>
    <div style="position:relative;margin-top:12px"><i class="fa-solid fa-magnifying-glass mut" style="position:absolute;left:12px;top:12px;font-size:12px"></i><input class="in" style="padding-left:32px" placeholder="Cari nama murid, nombor kad pengenalan, atau unit..." value="${esc(S.st.anQ || '')}" onchange="S.st.anQ=this.value;App.refresh()"></div>
    <div class="row mt" style="justify-content:space-between;background:var(--soft);padding:8px 12px;border-radius:10px"><span class="sm"><i class="fa-solid fa-circle-info" style="color:var(--ok)"></i> <b>Petunjuk Status Kehadiran:</b></span><div class="legend"><span class="mark y">✓</span>Hadir <span class="mark n">✗</span>Tidak Hadir <span class="mark x">–</span>Belum Rekod</div></div></div>
  <div class="grid g4 mb">
    <div class="card stat"><span class="si c-blue"><i class="fa-solid fa-users"></i></span><div><small>Jumlah Murid</small><b>${ms.length}</b></div></div>
    <div class="card stat"><span class="si c-green"><i class="fa-solid fa-percent"></i></span><div><small>Purata Hadir</small><b style="color:var(--ok)">${pct(totH, tot)}%</b></div></div>
    <div class="card stat"><span class="si c-vio"><i class="fa-solid fa-calendar-check"></i></span><div><small>Perjumpaan</small><b style="color:var(--vio)">${cols}</b></div></div>
    <div class="card stat"><span class="si c-orange"><i class="fa-solid fa-award"></i></span><div><small>Hadir Penuh (100%)</small><b style="color:#ea580c">${penuh}</b></div></div></div>
  <div class="card"><div class="row" style="justify-content:flex-end;padding:10px 12px"><button class="btn sm" onclick="cetak('Analisis Kehadiran',$('#anTbl').outerHTML)"><i class="fa-solid fa-print"></i> Cetak</button></div><div class="tw"><table class="t" id="anTbl"><thead><tr><th>Bil</th><th>Nama Murid</th><th class="c">Kelas</th><th>Unit Kokurikulum</th>${Array.from({ length: cols }, (_, i) => `<th class="c">${i + 1}</th>`).join('')}<th class="c">Jumlah Hadir</th></tr></thead>
  <tbody>${rows.join('') || `<tr><td colspan="${cols + 5}">${empty('Tiada murid sepadan.')}</td></tr>`}</tbody></table></div></div>`;
}
function anGuru() {
  const rows = S.d.guru.slice().sort(sortNama).map(g => {
    const us = S.d.unit.filter(u => (u.guru || []).includes(g.id));
    const pj = S.d.perjumpaan.filter(p => us.some(u => u.id === p.unitId));
    const h = pj.filter(p => (p.guruHadir || []).includes(g.id)).length;
    const lain = S.d.perjumpaan.filter(p => !us.some(u => u.id === p.unitId) && (p.guruHadir || []).includes(g.id)).length;
    return { g, us, pj, h, lain };
  });
  return `<div class="card"><div class="tw"><table class="t"><thead><tr><th>Bil</th><th>Nama Guru</th><th>Unit Dinasihati</th><th class="c">Perjumpaan Unit</th><th class="c">Hadir</th><th class="c">Bertugas Unit Lain</th><th class="c">Peratus</th></tr></thead><tbody>
  ${rows.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r.g.nama)}</b></td><td>${r.us.map(u => `<span class="bdg vio" style="margin:2px">${esc(u.nama)}</span>`).join('') || '<span class="mut sm">-</span>'}</td><td class="c">${r.pj.length}</td><td class="c">${r.h}</td><td class="c">${r.lain}</td>
  <td class="c">${r.pj.length ? `<span class="bdg ${pct(r.h, r.pj.length) >= 75 ? 'ok' : 'bad'}">${pct(r.h, r.pj.length)}%</span>` : '<i class="mut sm">-</i>'}</td></tr>`).join('') || `<tr><td colspan="7">${empty('Tiada guru didaftarkan.')}</td></tr>`}
  </tbody></table></div></div>`;
}
</script>
<script>
/* ---------- Pemilih murid (guna semula) ---------- */
function pickerHTML(pre, selected) {
  S.st['pk_' + pre] = new Set(selected || []);
  return `<div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
    <input class="in" id="${pre}_q" placeholder="Cari nama / No. KP..." oninput="pickerDraw('${pre}')">
    <select class="in" id="${pre}_u" onchange="pickerDraw('${pre}')"><option value="">Semua murid</option><option value="__sel">✔ Dipilih sahaja</option>${KATS.map(k => `<optgroup label="${KAT[k].nama}">${unitsOf(k).map(u => opt(u.id, u.nama)).join('')}</optgroup>`).join('')}<optgroup label="Tahun">${S.d.settings.tahun.map(t => opt('T:' + t, t)).join('')}</optgroup></select></div>
    <div class="row sm" style="justify-content:space-between;margin-bottom:6px"><span class="mut">Dipilih: <b id="${pre}_n">${S.st['pk_' + pre].size}</b> murid</span><span><a style="cursor:pointer;color:var(--p);font-weight:600" onclick="pickerAll('${pre}',true)">Pilih semua dipapar</a> · <a style="cursor:pointer;color:var(--mut)" onclick="pickerAll('${pre}',false)">Nyahpilih</a></span></div>
    <div id="${pre}_list" style="max-height:300px;overflow:auto;border:1px solid var(--bd);border-radius:10px"></div>`;
}
function pickerList(pre) {
  const q = val(pre + '_q').toLowerCase(), f = val(pre + '_u'), sel = S.st['pk_' + pre];
  let ms = S.d.murid;
  if (f === '__sel') ms = ms.filter(m => sel.has(m.id));
  else if (f.startsWith('T:')) ms = ms.filter(m => m.tahun === f.slice(2));
  else if (f) { const u = unitById(f); ms = ms.filter(m => m.unit && m.unit[u.kat] === f); }
  if (q) ms = ms.filter(m => m.nama.toLowerCase().includes(q) || String(m.ic).includes(q));
  return ms.slice().sort(sortNama);
}
function pickerDraw(pre) {
  const sel = S.st['pk_' + pre], ms = pickerList(pre);
  $('#' + pre + '_list').innerHTML = ms.slice(0, 300).map(m => `<label class="row" style="padding:7px 10px;border-bottom:1px solid var(--bd);cursor:pointer;flex-wrap:nowrap"><input type="checkbox" style="accent-color:var(--p)" ${sel.has(m.id) ? 'checked' : ''} onchange="pickerTog('${pre}','${m.id}',this.checked)"><span style="flex:1;font-size:12px"><b>${esc(m.nama)}</b> <span class="mut">• ${kelasM(m)}</span></span></label>`).join('') || '<div class="empty" style="padding:16px">Tiada murid</div>';
  $('#' + pre + '_n').textContent = sel.size;
}
function pickerTog(pre, id, on) { const s = S.st['pk_' + pre]; on ? s.add(id) : s.delete(id); $('#' + pre + '_n').textContent = s.size; }
function pickerAll(pre, on) { const s = S.st['pk_' + pre]; pickerList(pre).forEach(m => on ? s.add(m.id) : s.delete(m.id)); pickerDraw(pre); }

const katSel = (id, sel, umum = true) => `<select class="in" id="${id}">${KATS.map(k => opt(k, KAT[k].nama, sel)).join('')}${umum ? opt('UMUM', 'Umum / Sekolah', sel) : ''}</select>`;
const katNama = k => KAT[k] ? KAT[k].nama : 'Umum / Sekolah';
const perBdg = p => `<span class="bdg ${{ Antarabangsa: 'vio', Kebangsaan: 'info', Negeri: 'ok', Daerah: 'warn' }[p] || ''}">${esc(p || '-')}</span>`;
function rumusanKedudukan(arr) {
  const c = {}; arr.forEach(x => { if (x.kedudukan) c[x.kedudukan] = (c[x.kedudukan] || 0) + 1; });
  return KEDUDUKAN.filter(k => c[k]).map(k => `<span class="bdg ${k === 'Johan' ? 'warn' : k === 'Penyertaan' ? '' : 'info'}" style="margin:1px">${c[k]} ${k}</span>`).join(' ') || '<span class="mut sm">-</span>';
}

/* ==================== PROGRAM / AKTIVITI ==================== */
Pages.program = () => {
  const tab = S.st.progTab || 'daftar', fk = S.st.prK || '', fp = S.st.prP || '', q = (S.st.prQ || '').toLowerCase();
  const cnt = s => S.d.program.filter(p => p.status === s).length;
  let ps = S.d.program.filter(p => p.status === tab && (!fk || p.kat === fk) && (!fp || p.peringkat === fp));
  if (q) ps = ps.filter(p => [p.nama, p.tempat, p.anjuran, (unitById(p.unitId) || {}).nama, ...(p.guru || []).map(g => (guruById(g) || {}).nama)].join(' ').toLowerCase().includes(q));
  ps.sort((a, b) => String(b.tarikh).localeCompare(a.tarikh));
  const T = [['daftar', 'fa-user-pen', '1. Daftar Program', 'warn'], ['laporan', 'fa-file-signature', '2. Laporan Program', 'info'], ['selesai', 'fa-circle-check', '3. Laporan Selesai', 'ok']];
  return `<div class="tabs full mb">${T.map(([s, ic, t, c]) => `<button class="tab ${tab === s ? 'on' : ''}" onclick="S.st.progTab='${s}';App.refresh()"><i class="fa-solid ${ic}"></i> ${t} <span class="bdg ${c}">${cnt(s)}</span></button>`).join('')}</div>
  <div class="card pad mb"><div class="grid g2 mb"><select class="in" onchange="S.st.prK=this.value;App.refresh()">${opt('', '📁 Semua Kategori', fk)}${KATS.map(k => opt(k, KAT[k].nama, fk)).join('')}${opt('UMUM', 'Umum / Sekolah', fk)}</select>
    <select class="in" onchange="S.st.prP=this.value;App.refresh()">${opt('', '🏅 Semua Peringkat', fp)}${PERINGKAT.map(p => opt(p, p, fp)).join('')}</select></div>
    <input class="in" placeholder="🔍 Cari nama program, tempat, anjuran unit, penganjur, guru..." value="${esc(S.st.prQ || '')}" onchange="S.st.prQ=this.value;App.refresh()"></div>
  <div class="grid g2">${ps.map(progCard).join('') || `<div class="card" style="grid-column:1/-1">${empty(tab === 'daftar' ? 'Tiada program berdaftar. Klik <b>Daftar Program</b> untuk mula.' : tab === 'laporan' ? 'Tiada laporan program dalam proses.' : 'Tiada laporan program yang selesai.', 'fa-calendar-xmark')}</div>`}</div>
  ${canEdit() ? `<button class="btn pri fab" onclick="formProgram()"><i class="fa-solid fa-plus"></i> Daftar Program</button>` : ''}`;
};
function progCard(p) {
  const u = unitById(p.unitId);
  const act = !canEdit() ? '' : p.status === 'daftar' ? `<button class="btn sm" onclick="formProgram('${p.id}')"><i class="fa-solid fa-pen"></i> Edit</button><button class="btn pri sm" onclick="formLapProgram('${p.id}')"><i class="fa-solid fa-file-signature"></i> Buat Laporan</button>`
    : p.status === 'laporan' ? `<button class="btn sm" onclick="formLapProgram('${p.id}')"><i class="fa-solid fa-pen"></i> Kemaskini Laporan</button><button class="btn ok sm" onclick="setStatusProg('${p.id}','selesai')"><i class="fa-solid fa-check"></i> Sahkan Selesai</button>`
    : `<button class="btn sm" onclick="setStatusProg('${p.id}','laporan')"><i class="fa-solid fa-rotate-left"></i> Buka Semula</button>`;
  return `<div class="card pad" style="display:flex;flex-direction:column;gap:8px"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><b style="font-size:14px;cursor:pointer" onclick="lihatProgram('${p.id}')">${esc(p.nama)}</b>
    <div class="mut" style="font-size:11.5px;margin-top:3px"><i class="fa-regular fa-calendar"></i> ${fmtD(p.tarikh)} &nbsp; <i class="fa-solid fa-location-dot"></i> ${esc(p.tempat || '-')}</div></div>${perBdg(p.peringkat)}</div>
    <div class="row" style="gap:6px"><span class="bdg" style="background:${(KAT[p.kat] || {}).bg || 'var(--soft)'};color:${(KAT[p.kat] || {}).c || 'var(--mut)'}">${katNama(p.kat)}</span>${u ? `<span class="bdg">${esc(u.nama)}</span>` : ''}<span class="bdg"><i class="fa-solid fa-users"></i> ${(p.peserta || []).length} peserta</span>${p.anjuran ? `<span class="bdg">Anjuran: ${esc(p.anjuran)}</span>` : ''}</div>
    ${p.status !== 'daftar' ? `<div>${rumusanKedudukan(p.peserta || [])}</div>` : ''}
    <div class="mut" style="font-size:11.5px"><i class="fa-solid fa-chalkboard-user"></i> ${(p.guru || []).map(guruById).filter(Boolean).map(g => esc(g.nama)).join(', ') || '-'}</div>

  <div class="card pad mb"><b class="sm">PENCAPAIAN &amp; PENYERTAAN (${s.pc.length})</b><table class="t mt"><thead><tr><th>Program / Pertandingan</th><th>Peringkat</th><th>Pencapaian</th><th>Tarikh</th><th></th></tr></thead><tbody>${s.pc.map(x => `<tr><td><b>${esc(x.nama)}</b><div class="mut" style="font-size:10.5px">${x.sumber}</div></td><td>${perBdg(x.peringkat)}</td><td><span class="bdg ${x.kedudukan === 'Johan' ? 'warn' : 'info'}">${esc(x.kedudukan)}</span></td><td>${fmtD(x.tarikh)}</td><td>${x.rid && canEdit() ? `<button class="icb del" onclick="padamPencapaian('${x.rid}','${m.id}')"><i class="fa-solid fa-trash"></i></button>` : ''}</td></tr>`).join('') || `<tr><td colspan="5" class="mut">Tiada rekod.</td></tr>`}</tbody></table></div>
  <div class="card pad"><b class="sm">EKSTRA KURIKULUM</b><div class="row mt">${S.d.ekstra.filter(e => (e.murid || []).includes(m.id)).map(e => `<span class="bdg vio"><i class="fa-solid ${e.ic}"></i> ${esc(e.nama)}</span>`).join('') || '<span class="mut sm">Tiada</span>'}</div></div>`;

/* ==================== RUMUSAN PENCAPAIAN ==================== */
Pages['pencapaian-rumusan'] = () => {
  const all = S.d.murid.map(m => ({ m, s: skor(m) }));
  const G = ['A', 'B', 'C', 'D', 'E'].map(g => ({ g, n: all.filter(x => gred(x.s.jumlah) === g).length }));
  const mx = Math.max(1, ...G.map(x => x.n));
  const units = ['BB', 'KP', 'SP'].flatMap(k => unitsOf(k)).map(u => {
    const a = all.filter(x => x.m.unit && x.m.unit[u.kat] === u.id); const kk = [u.kat];
    const sk = a.map(x => ({ m: x.m, v: skor(x.m, kk).jumlah })).sort((p, q) => q.v - p.v);
    return { u, n: a.length, avg: a.length ? Math.round(sk.reduce((t, x) => t + x.v, 0) / a.length * 10) / 10 : 0, kh: (() => { let h = 0, t = 0; a.forEach(x => { const r = kehadiranMurid(x.m, kk); h += r.h; t += r.t; }); return pct(h, t); })(), jw: S.d.jawatan.filter(j => j.unitId === u.id).length, top: sk[0] };
  });
  return `<div class="ph"><span class="phi"><i class="fa-solid fa-chart-pie"></i></span><div><h2>Rumusan Pencapaian</h2><p>Taburan gred keseluruhan murid dan prestasi setiap unit kokurikulum</p></div><div class="act"><button class="btn" onclick="App.go('pencapaian')"><i class="fa-solid fa-address-card"></i> Profil Murid</button><button class="btn pri" onclick="cetak('Rumusan Pencapaian','<h2>RUMUSAN PRESTASI UNIT</h2>'+$('#rmTbl').outerHTML)"><i class="fa-solid fa-print"></i> Cetak</button></div></div>
  <div class="grid g2 mb"><div class="card pad"><b class="sm">TABURAN GRED KESELURUHAN (${all.length} murid)</b><div class="row mt" style="align-items:flex-end;height:150px;gap:14px;flex-wrap:nowrap">${G.map((x, i) => `<div style="flex:1;text-align:center"><div style="font-weight:800;font-size:12px">${x.n}</div><div style="height:${x.n / mx * 110}px;min-height:3px;border-radius:7px 7px 0 0;background:${['#10b981', '#0ea5e9', '#f59e0b', '#f97316', '#e11d48'][i]}"></div><div class="mut sm" style="margin-top:4px">Gred ${x.g}</div></div>`).join('')}</div><div class="mut" style="font-size:10.5px;margin-top:8px">A ≥80 • B ≥60 • C ≥40 • D ≥20 • E &lt;20</div></div>
    <div class="card pad"><b class="sm">10 MURID TERBAIK KESELURUHAN</b>${all.slice().sort((a, b) => b.s.jumlah - a.s.jumlah).slice(0, 10).map((x, i) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:nowrap;cursor:pointer" onclick="profilMurid('${x.m.id}')"><span style="width:24px;text-align:center">${['🥇', '🥈', '🥉'][i] || i + 1}</span><span style="flex:1;font-size:12px;font-weight:600">${esc(x.m.nama)}</span><span class="mut sm">${kelasM(x.m)}</span><b style="color:var(--p)">${x.s.jumlah}</b></div>`).join('')}</div></div>
  <div class="card"><div class="tw"><table class="t" id="rmTbl"><thead><tr><th>Unit</th><th>Kategori</th><th class="c">Ahli</th><th class="c">Purata Markah Unit</th><th class="c">Purata Kehadiran</th><th class="c">AJK</th><th>Murid Terbaik</th></tr></thead><tbody>
  ${units.map(r => `<tr><td><b>${esc(r.u.nama)}</b></td><td><span class="bdg" style="background:${KAT[r.u.kat].bg};color:${KAT[r.u.kat].c}">${r.u.kat}</span></td><td class="c">${r.n}</td><td class="c"><b>${r.avg}</b></td><td class="c">${r.kh}%</td><td class="c">${r.jw}</td><td style="font-size:11.5px">${r.top ? `${esc(r.top.m.nama)} <b>(${r.top.v})</b>` : '-'}</td></tr>`).join('')}
  </tbody></table></div></div>`;
};

function rekodSekolah() {
  const rows = [];

  S.d.pencapaian.forEach(r => { const m = muridById(r.muridId); rows.push({ id: r.id, jenis: 'r', nama: r.nama, tarikh: r.tarikh, tempat: m ? m.nama : '', kat: r.kat, unit: 'Individu', peringkat: r.peringkat, res: [{ kedudukan: r.kedudukan }], peserta: 1, status: 'selesai' }); });
  return rows;
}

  <div class="grid g5 mb">${M.map(([k, t, tag, s, bg, c]) => `<div class="card kcard" style="background:linear-gradient(180deg,${bg},var(--card))"><span class="tag bdg" style="color:${c}">${tag}</span><span class="stat" style="padding:0"><span class="si" style="background:${bg};color:${c}"><i class="fa-solid fa-medal"></i></span></span><h4>${t}</h4><span class="big" style="color:${c}">${cnt(all, k)}</span> <span class="mut sm">kali</span><div style="font-size:10.5px;color:${c};margin-top:4px">${s}</div></div>`).join('')}
    <div class="card kcard" style="background:linear-gradient(180deg,#e6f8f0,var(--card))"><span class="tag bdg ok">PESERTA</span><span class="stat" style="padding:0"><span class="si c-green"><i class="fa-solid fa-users"></i></span></span><h4>Jumlah Peserta</h4><span class="big" style="color:#059669">${new Set(S.d.program.flatMap(p => (p.peserta || []).map(x => x.muridId)).concat(S.d.pencapaian.map(x => x.muridId))).size}</span> <span class="mut sm">orang</span><div style="font-size:10.5px;color:#059669;margin-top:4px">Penglibatan Murid Sekolah</div></div></div>
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><b class="sm"><i class="fa-solid fa-chart-simple"></i> RUMUSAN MENGIKUT PERINGKAT</b><span class="mut" style="font-size:11px">Klik mana-mana kad untuk menapis senarai program</span></div>
  <div class="grid g6 mb">${PC.map(([k, t, tag, ic], i) => { const r = k ? all.filter(x => grp[k].includes(x.peringkat)) : all; const med = r.reduce((n, x) => n + x.res.filter(y => ['Johan', 'Naib Johan', 'Ketiga'].includes(y.kedudukan)).length, 0); return `<div class="card kcard clk ${fp === k ? 'sel' : ''}" onclick="S.st.skP='${k}';App.refresh()"><span class="tag bdg" style="${fp === k ? 'background:rgba(255,255,255,.2);color:#fff' : `color:${pc[i]}`}">${tag}</span><span class="stat" style="padding:0"><span class="si" style="background:${fp === k ? 'rgba(255,255,255,.15)' : 'var(--soft)'};color:${fp === k ? '#fff' : pc[i]}"><i class="fa-solid ${ic}"></i></span></span><h4>${t}</h4><span class="big">${r.length}</span> <span style="font-size:11px;opacity:.7">prog</span><div style="font-size:10.5px;opacity:.75;margin-top:6px;border-top:1px solid ${fp === k ? 'rgba(255,255,255,.15)' : 'var(--bd)'};padding-top:6px">🏆 ${med} pingat</div></div>`; }).join('')}</div>
  <div class="card pad mb"><div class="row mb" style="justify-content:space-between"><b><i class="fa-solid fa-sliders"></i> PENAPIS PROGRAM &amp; PERTANDINGAN</b><div class="row"><div class="tabs" style="padding:3px"><button class="tab ${view === 'jadual' ? 'on' : ''}" style="padding:5px 10px" onclick="S.st.skV='jadual';App.refresh()"><i class="fa-solid fa-list"></i> Jadual</button><button class="tab ${view === 'kad' ? 'on' : ''}" style="padding:5px 10px" onclick="S.st.skV='kad';App.refresh()"><i class="fa-solid fa-grip"></i> Kad</button></div><button class="btn sm" onclick="S.st.skP=S.st.skK=S.st.skS=S.st.skQ='';App.refresh()"><i class="fa-solid fa-rotate-left"></i> Set Semula</button></div></div>
    <div class="grid g4"><div><label class="l"><i class="fa-solid fa-trophy"></i>Peringkat Pertandingan</label><select class="in" onchange="S.st.skP=this.value;App.refresh()">${PC.map(([k, t]) => opt(k, k ? t : 'Semua Peringkat', fp)).join('')}</select></div>
      <div><label class="l"><i class="fa-solid fa-shapes"></i>Kategori Unit</label><select class="in" onchange="S.st.skK=this.value;App.refresh()">${opt('', 'Semua Kategori Unit', fk)}${KATS.map(k => opt(k, KAT[k].nama, fk)).join('')}${opt('UMUM', 'Umum / Sekolah', fk)}</select></div>
      <div><label class="l"><i class="fa-solid fa-medal"></i>Status Kejayaan</label><select class="in" onchange="S.st.skS=this.value;App.refresh()">${opt('', 'Semua Rekod Program', fs)}${opt('menang', 'Ada Kejayaan / Pingat', fs)}${opt('sertai', 'Penyertaan Sahaja', fs)}</select></div>
      <div><label class="l"><i class="fa-solid fa-magnifying-glass"></i>Carian Bebas</label><input class="in" placeholder="Cari nama program, tempat..." value="${esc(S.st.skQ || '')}" onchange="S.st.skQ=this.value;App.refresh()"></div></div>
    <div class="row sm" style="justify-content:space-between;margin-top:10px"><span><span style="color:var(--ok)">●</span> Penapis: ${fp ? PC.find(x => x[0] === fp)[1] : 'Semua Peringkat'}</span><span class="mut">Memaparkan <b>${rs.length}</b> daripada <b>${all.length}</b> program</span></div></div>
  ${view === 'jadual' ? `<div class="card"><div class="tw"><table class="t" id="skTbl"><thead><tr><th>Bil</th><th>Nama Program &amp; Maklumat</th><th>Kategori &amp; Unit</th><th>Peringkat</th><th>Rumusan Pencapaian / Keputusan</th><th class="c">Peserta</th><th class="c noprint">Tindakan</th></tr></thead><tbody>
    ${rs.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r.nama)}</b><div class="mut" style="font-size:11px">${fmtD(r.tarikh)} • ${esc(r.tempat || '')}</div></td><td>${katNama(r.kat)}<div class="mut" style="font-size:11px">${esc(r.unit || '')}</div></td><td>${perBdg(r.peringkat)}</td><td>${r.status === 'daftar' ? '<span class="bdg warn">Belum dilaporkan</span>' : rumusanKedudukan(r.res)}</td><td class="c">${r.peserta}</td><td class="c noprint">${r.jenis === 'p' ? `<button class="icb" onclick="lihatProgram('${r.id}')"><i class="fa-solid fa-eye"></i></button>` : `<button class="icb" onclick="profilMurid('${(S.d.pencapaian.find(x => x.id === r.id) || {}).muridId}')"><i class="fa-solid fa-user"></i></button>`}</td></tr>`).join('') || `<tr><td colspan="7">${empty('Tiada rekod pencapaian sepadan.')}</td></tr>`}
  </tbody></table></div></div>` : `<div class="grid g3" id="skTbl">${rs.map(r => `<div class="card pad" style="cursor:pointer" onclick="${r.jenis === 'p' ? `lihatProgram('${r.id}')` : `profilMurid('${(S.d.pencapaian.find(x => x.id === r.id) || {}).muridId}')`}"><div class="row" style="justify-content:space-between">${perBdg(r.peringkat)}<span class="mut" style="font-size:11px">${fmtD(r.tarikh)}</span></div><b style="display:block;margin:8px 0 4px">${esc(r.nama)}</b><div class="mut" style="font-size:11px;margin-bottom:8px">${katNama(r.kat)} • ${esc(r.unit || '')} • ${r.peserta} peserta</div>${rumusanKedudukan(r.res)}</div>`).join('') || `<div class="card" style="grid-column:1/-1">${empty('Tiada rekod.')}</div>`}</div>`}`;

<script>
/* ==================== PENGURUSAN & ADMIN ==================== */
const ADM_TABS = [['profil', 'fa-school', 'Profil Sekolah'], ['murid', 'fa-user-graduate', 'Data Murid'], ['guru', 'fa-chalkboard-user', 'Data Guru'], ['unit', 'fa-layer-group', 'Daftar Unit'], ['agihan', 'fa-shuffle', 'Agihan Unit Murid'], ['tetapan', 'fa-sliders', 'Markah & Tetapan'], ['sandaran', 'fa-database', 'Sandaran Data']];
Pages.admin = () => {
  if (!isAdmin()) return empty('Hanya pentadbir dibenarkan.', 'fa-lock');
  const t = S.st.admTab || 'profil';
  return `<div class="tabs full mb" style="overflow:auto">${ADM_TABS.map(([k, ic, n]) => `<button class="tab ${t === k ? 'on' : ''}" onclick="S.st.admTab='${k}';App.refresh()"><i class="fa-solid ${ic}"></i> ${n}</button>`).join('')}</div>
  <div class="row mb" style="justify-content:space-between"><div><b style="font-size:15px">Setup &amp; Konfigurasi Sistem</b><div class="mut sm">Urus profil sekolah, data murid &amp; guru, unit kokurikulum, markah PAJSK dan sandaran data.</div></div><button class="btn sm" style="color:var(--ok)" onclick="App.guide()"><i class="fa-solid fa-book-open"></i> Panduan Penggunaan</button></div>
  ${({ profil: admProfil, murid: admMurid, guru: admGuru, unit: admUnit, agihan: admAgihan, tetapan: admTetapan, sandaran: admSandaran }[t])()}`;
};

/* ---- Profil ---- */
function admProfil() {
  const s = S.d.settings;
  return `<div class="card pad mb">
    <div class="row" style="justify-content:space-between"><label class="l">Nama Sekolah</label><span class="bdg ok"><i class="fa-solid fa-pen"></i> Boleh Diubah</span></div>
    <input class="in mb" id="sp_n" value="${esc(s.namaSekolah)}" style="font-weight:700;font-size:15px">
    <div class="grid g2 mb"><div><label class="l">Sesi</label><input class="in" id="sp_s" value="${esc(s.sesi)}" placeholder="cth: 2026"></div><div><label class="l">Alamat</label><input class="in" id="sp_a" value="${esc(s.alamat)}" placeholder="Alamat sekolah"></div></div>
    <div class="card pad" style="background:var(--soft)"><div class="row" style="justify-content:space-between"><b class="sm"><i class="fa-solid fa-key" style="color:var(--ok)"></i> KATALALUAN PENTADBIR (ADMIN PASSWORD)</b><span class="bdg ok">Boleh Diubah</span></div>
      <label class="l mt">Katalaluan Pentadbir ${GAS ? 'Baharu' : 'Semasa'}:</label><div style="position:relative;max-width:380px"><input class="in" id="sp_pw" type="password" value="${GAS ? '' : esc(s.adminPassword)}" placeholder="${GAS ? 'Biarkan kosong jika tidak mahu tukar' : ''}"><button class="icb" style="position:absolute;right:5px;top:5px" onclick="const i=$('#sp_pw');i.type=i.type==='password'?'text':'password'"><i class="fa-solid fa-key"></i></button></div>
      <div class="mut" style="font-size:11px;margin-top:5px">Katalaluan asal adalah <b style="color:var(--ok)">admin123</b>. Sila tukar selepas pemasangan.</div></div></div>
  <div class="grid g2 mb">
    <div class="card pad"><b><i class="fa-solid fa-palette" style="color:var(--ok)"></i> Warna Tema Utama Portal</b><div class="mut sm" style="margin:4px 0 14px">Pilih warna identiti sekolah. Bar atas dan butang utama akan mengikut warna ini.</div>
      <label class="l">Pilihan Warna Rasmi:</label><div class="row" id="sp_th">${THEMES.map(c => `<span class="swatch ${s.theme === c ? 'on' : ''}" style="background:${c}" data-c="${c}" onclick="pilihTema('${c}')">${s.theme === c ? '✓' : ''}</span>`).join('')}<input type="color" value="${s.theme}" oninput="pilihTema(this.value)" style="width:40px;height:40px;border:0;background:none;cursor:pointer" title="Warna lain"></div></div>
    <div class="card pad"><b>Penjenamaan Portal &amp; Logo</b><div class="mut sm" style="margin:4px 0 12px">Muat naik logo rasmi sekolah. Format PNG disyorkan untuk logo tanpa latar.</div>
      <div class="card pad mb" style="text-align:center;background:var(--soft)"><div class="mut" style="font-size:10px;font-weight:700">PREBIU SEMASA:</div><div id="sp_lg" style="margin-top:8px">${s.logo ? `<img src="${s.logo}" style="height:64px">` : '<i class="fa-solid fa-school" style="font-size:40px;color:var(--mut)"></i>'}</div></div>
      <div class="drop" onclick="pilihLogo()" ondragover="event.preventDefault()" ondrop="event.preventDefault();bacaLogo(event.dataTransfer.files[0])"><i class="fa-solid fa-cloud-arrow-up" style="font-size:20px"></i><div><b style="color:var(--ok);text-decoration:underline">Klik untuk muat naik</b> atau heret imej ke sini</div></div>
      ${s.logo ? `<button class="btn sm mt" onclick="S.d.settings.logo='';$('#sp_lg').innerHTML='<i class=&quot;fa-solid fa-school&quot; style=&quot;font-size:40px&quot;></i>'">Buang logo</button>` : ''}</div></div>
  <div class="row" style="justify-content:flex-end"><button class="btn pri" onclick="simpanProfil()"><i class="fa-solid fa-floppy-disk"></i> Simpan Profil Sekolah</button></div>`;
}
function pilihTema(c) { S.d.settings.theme = c; applyTheme(); $$('#sp_th .swatch').forEach(x => { const on = x.dataset.c === c; x.classList.toggle('on', on); x.textContent = on ? '✓' : ''; }); }
function pilihLogo() { const f = $('#fileIn'); f.accept = 'image/*'; f.value = ''; f.onchange = () => bacaLogo(f.files[0]); f.click(); }
function bacaLogo(file) {
  if (!file) return; const rd = new FileReader();
  rd.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 160 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); S.d.settings.logo = c.toDataURL('image/png'); $('#sp_lg').innerHTML = `<img src="${S.d.settings.logo}" style="height:64px">`; toast('Logo dimuatkan. Klik Simpan.', 'info'); }; img.src = rd.result; };
  rd.readAsDataURL(file);
}
async function simpanProfil() {
  const s = S.d.settings; s.namaSekolah = val('sp_n') || s.namaSekolah; s.sesi = val('sp_s'); s.alamat = val('sp_a');
  const pw = val('sp_pw'); if (pw) { if (pw.length < 4) return toast('Katalaluan terlalu pendek.', 'bad'); s.adminPassword = pw; } else if (GAS) delete s.adminPassword;
  if (await DB.settings()) { if (GAS) delete s.adminPassword; toast('Profil sekolah disimpan.'); renderNav(); }
}

/* ---- Murid ---- */
function admMurid() {
  const q = (S.st.amQ || '').toLowerCase(), t = S.st.amT || '';
  const ms = S.d.murid.filter(m => (!t || m.tahun === t) && (!q || m.nama.toLowerCase().includes(q) || String(m.ic).includes(q))).sort((a, b) => (a.tahun || '').localeCompare(b.tahun || '') || sortNama(a, b));
  return `<div class="card pad mb row"><input class="in" style="flex:1;min-width:200px" placeholder="🔍 Cari nama / No. KP" value="${esc(S.st.amQ || '')}" onchange="S.st.amQ=this.value;App.refresh()"><select class="in" style="width:160px" onchange="S.st.amT=this.value;App.refresh()">${opt('', 'Semua Tahun', t)}${S.d.settings.tahun.map(x => opt(x, x, t)).join('')}</select>
    <button class="btn" onclick="importMurid()"><i class="fa-solid fa-paste"></i> Import / Tampal Excel</button><button class="btn" onclick="eksportMuridCSV()"><i class="fa-solid fa-file-csv"></i> Eksport CSV</button><button class="btn pri" onclick="formMurid()"><i class="fa-solid fa-plus"></i> Tambah Murid</button></div>
  <div class="card"><div class="row" style="padding:10px 14px;justify-content:space-between"><b class="sm">${ms.length} murid</b>${ms.length ? `<button class="btn sm bad" onclick="padamBanyakMurid()"><i class="fa-solid fa-trash"></i> Padam semua dipapar</button>` : ''}</div><div class="tw"><table class="t"><thead><tr><th>Bil</th><th>Nama</th><th>No. KP</th><th>Jantina</th><th>Tahun/Kelas</th>${KATS.map(k => `<th>${k}</th>`).join('')}<th class="c">Tindakan</th></tr></thead><tbody>
  ${ms.map((m, i) => `<tr><td>${i + 1}</td><td><b style="font-size:12px">${esc(m.nama)}</b></td><td style="font-size:11.5px">${esc(m.ic)}</td><td>${m.jantina === 'Lelaki' ? 'L' : 'P'}</td><td>${kelasM(m)}</td>${KATS.map(k => `<td style="font-size:11px">${esc((unitById(m.unit && m.unit[k]) || {}).nama || '-')}</td>`).join('')}<td class="c" style="white-space:nowrap"><button class="icb" onclick="formMurid('${m.id}')"><i class="fa-solid fa-pen"></i></button><button class="icb del" onclick="padamMurid('${m.id}')"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('') || `<tr><td colspan="10">${empty('Tiada murid. Klik <b>Import / Tampal Excel</b> untuk memasukkan senarai murid.')}</td></tr>`}
  </tbody></table></div></div>`;
}
const jantinaIC = ic => { const d = String(ic).replace(/\D/g, ''); return d.length >= 12 ? (+d[11] % 2 ? 'Lelaki' : 'Perempuan') : ''; };
function formMurid(id) {
  const m = id ? muridById(id) : null, s = S.d.settings;
  const mid = modal(`<i class="fa-solid fa-user-graduate"></i> ${m ? 'Edit' : 'Tambah'} Murid`, `
    <div class="mb"><label class="l">Nama Penuh</label><input class="in" id="am_n" value="${esc(m ? m.nama : '')}" style="text-transform:uppercase"></div>
    <div class="grid g2 mb"><div><label class="l">No. Kad Pengenalan / Sijil Lahir</label><input class="in" id="am_ic" value="${esc(m ? m.ic : '')}" oninput="const j=jantinaIC(this.value);if(j)$('#am_j').value=j"></div><div><label class="l">Jantina</label><select class="in" id="am_j">${['Lelaki', 'Perempuan'].map(x => opt(x, x, m ? m.jantina : '')).join('')}</select></div></div>
    <div class="grid g2 mb"><div><label class="l">Tahun</label><select class="in" id="am_t">${s.tahun.map(x => opt(x, x, m ? m.tahun : '')).join('')}</select></div><div><label class="l">Kelas</label><select class="in" id="am_k">${s.kelas.map(x => opt(x, x, m ? m.kelas : '')).join('')}</select></div></div>
    <div class="grid g2">${KATS.map(k => `<div><label class="l">${KAT[k].nama}</label><select class="in" id="am_${k}">${opt('', '- Tiada -')}${unitsOf(k).map(u => opt(u.id, u.nama, m && m.unit ? m.unit[k] : '')).join('')}</select></div>`).join('')}</div>`,
    `<button class="btn" onclick="closeM()">Batal</button><button class="btn pri" id="am_s"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>`);
  document.getElementById('am_s').onclick = async () => {
    if (!val('am_n')) return toast('Sila isi nama.', 'bad');
    const rec = Object.assign({}, m || { id: uid() }, { nama: val('am_n').toUpperCase(), ic: val('am_ic'), jantina: val('am_j'), tahun: val('am_t'), kelas: val('am_k'), unit: Object.fromEntries(KATS.map(k => [k, val('am_' + k)])) });
    if (await DB.put('murid', rec, 'Menyimpan murid...')) { closeM(mid); toast('Data murid disimpan.'); App.refresh(); }
  };
}
async function padamMurid(id) { if (await confirmBox('Padam murid ini? Rekod jawatan dan pencapaiannya akan kekal tetapi tidak dipaparkan.')) { await DB.del('murid', id); App.refresh(); } }
async function padamBanyakMurid() {
  const q = (S.st.amQ || '').toLowerCase(), t = S.st.amT || '';
  const ids = S.d.murid.filter(m => (!t || m.tahun === t) && (!q || m.nama.toLowerCase().includes(q) || String(m.ic).includes(q))).map(m => m.id);
  if (!await confirmBox(`Padam <b>${ids.length}</b> murid yang dipaparkan? Tindakan ini tidak boleh dibatalkan.`)) return;
  const d = JSON.parse(JSON.stringify(S.d)); const set = new Set(ids); d.murid = d.murid.filter(m => !set.has(m.id));
  if (GAS) await DB.replaceAll(d); else { S.d = d; DB.local(); }
  toast(ids.length + ' murid dipadam.'); App.refresh();

function importMurid() {
  const mid = modal('<i class="fa-solid fa-paste"></i> Import Murid dari Excel / Google Sheet', `
    <p class="sm" style="margin-top:0;line-height:1.6">Salin baris dari Excel/Google Sheet dan tampal di bawah. Susunan lajur:<br><code style="background:var(--soft);padding:3px 6px;border-radius:5px;font-size:11.5px">Nama | No KP | Jantina | Tahun | Kelas | Badan Beruniform | Kelab | Sukan | Rumah Sukan</code><br>

    <div class="row mt"><label class="chk"><input type="checkbox" id="im_u" checked> Cipta unit baharu jika nama unit tidak wujud</label><label class="chk"><input type="checkbox" id="im_k" checked> Tambah kelas/tahun baharu ke tetapan</label></div>
    <div id="im_p" class="mt"></div>`,
    `<button class="btn" onclick="closeM()">Batal</button><button class="btn" id="im_pv"><i class="fa-solid fa-eye"></i> Semak</button><button class="btn pri" id="im_s"><i class="fa-solid fa-file-import"></i> Import</button>`, 'lg');
  const parse = () => {
    const lines = val('im_t').split(/\r?\n/).map(l => l.split(/\t|;|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x => x.replace(/^"|"$/g, '').trim())).filter(r => r[0] && !/^nama$/i.test(r[0]));
    return lines.map(r => {
      let t = r[3] || ''; if (/^\d$/.test(t)) t = 'Tahun ' + t; else if (/^t(ahun)?\s*\d/i.test(t)) t = 'Tahun ' + t.replace(/\D/g, '');
      return { nama: r[0].toUpperCase(), ic: r[1] || '', jantina: /^p/i.test(r[2] || '') ? 'Perempuan' : /^l/i.test(r[2] || '') ? 'Lelaki' : jantinaIC(r[1]) || 'Lelaki', tahun: t, kelas: r[4] || '', u: { BB: r[5] || '', KP: r[6] || '', SP: r[7] || '', RS: r[8] || '' } };
    });
  };
  document.getElementById('im_pv').onclick = () => { const r = parse(); $('#im_p').innerHTML = `<b class="sm">${r.length} baris dikesan</b><div class="tw" style="max-height:200px;border:1px solid var(--bd);margin-top:6px"><table class="t"><tbody>${r.slice(0, 50).map(x => `<tr><td>${esc(x.nama)}</td><td>${esc(x.ic)}</td><td>${x.jantina[0]}</td><td>${esc(x.tahun)} ${esc(x.kelas)}</td><td style="font-size:11px">${KATS.map(k => esc(x.u[k])).filter(Boolean).join(' / ')}</td></tr>`).join('')}</tbody></table></div>`; };
  document.getElementById('im_s').onclick = async () => {
    const rows = parse(); if (!rows.length) return toast('Tiada data untuk diimport.', 'bad');
    const newUnits = [], s = S.d.settings; let setChanged = false;
    const findU = (k, n) => { if (!n) return ''; const lc = n.toLowerCase(); let u = S.d.unit.concat(newUnits).find(x => x.kat === k && x.nama.toLowerCase() === lc); if (!u && $('#im_u').checked) { u = { id: uid(), kat: k, nama: n, guru: [] }; newUnits.push(u); } return u ? u.id : ''; };
    const byIC = new Map(S.d.murid.filter(m => m.ic).map(m => [String(m.ic).replace(/\D/g, ''), m]));
    const recs = rows.map(r => {
      if ($('#im_k').checked) { if (r.tahun && !s.tahun.includes(r.tahun)) { s.tahun.push(r.tahun); s.tahun.sort(); setChanged = true; } if (r.kelas && !s.kelas.includes(r.kelas)) { s.kelas.push(r.kelas); setChanged = true; } }
      const old = byIC.get(String(r.ic).replace(/\D/g, ''));
      return Object.assign({}, old || { id: uid() }, { nama: r.nama, ic: r.ic, jantina: r.jantina, tahun: r.tahun, kelas: r.kelas, unit: Object.fromEntries(KATS.map(k => [k, findU(k, r.u[k]) || (old && old.unit ? old.unit[k] : '')])) });
    });
    if (newUnits.length && !await DB.putMany('unit', newUnits, 'Mendaftar unit baharu...')) return;
    if (setChanged) await DB.settings();
    if (await DB.putMany('murid', recs, `Mengimport ${recs.length} murid...`)) { closeM(mid); toast(`${recs.length} murid diimport${newUnits.length ? `, ${newUnits.length} unit baharu didaftar` : ''}.`); App.refresh(); }
  };
}
function muatTurun(nama, isi, jenis) {
  try { const b = new Blob([isi], { type: jenis }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nama; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  catch (e) { modal('Salin Data', `<textarea class="in" style="min-height:300px">${esc(isi)}</textarea>`); }
}

}

  <div class="grid g2">
    <div class="card pad"><b><i class="fa-solid fa-download"></i> Sandaran &amp; Pemulihan</b><p class="sm mut">Muat turun semua data sebagai fail JSON, atau pulihkan daripada fail sandaran.</p>
      <div class="row"><button class="btn pri" onclick="muatTurun('sandaran_koku_${today()}.json',JSON.stringify(Object.assign({},S.d,{settings:Object.assign({},S.d.settings,{adminPassword:undefined})}),null,1),'application/json')"><i class="fa-solid fa-download"></i> Muat Turun Sandaran</button>
      <button class="btn" onclick="pulihSandaran()"><i class="fa-solid fa-upload"></i> Pulihkan dari Fail</button></div></div>
    <div class="card pad" style="border-color:#fecdd3"><b style="color:var(--bad)"><i class="fa-solid fa-triangle-exclamation"></i> Zon Bahaya</b><p class="sm mut">Tindakan di bawah akan menggantikan semua data sedia ada.</p>
      <div class="row"><button class="btn" onclick="muatDemo()"><i class="fa-solid fa-flask"></i> Muat Data Demo</button><button class="btn bad" onclick="kosongkanData()"><i class="fa-solid fa-eraser"></i> Kosongkan Semua Data</button></div></div></div>`;
}
function pulihSandaran() {
  const f = $('#fileIn'); f.accept = '.json,application/json'; f.value = '';
  f.onchange = () => { const rd = new FileReader(); rd.onload = async () => { try { const d = JSON.parse(rd.result); if (!d.murid || !d.unit) throw 0; if (!await confirmBox(`Pulihkan sandaran (${d.murid.length} murid, ${d.unit.length} unit)? Semua data semasa akan diganti.`)) return; d.settings = Object.assign({}, d.settings, { adminPassword: GAS ? undefined : S.d.settings.adminPassword }); if (await DB.replaceAll(d)) { toast('Sandaran dipulihkan.'); applyTheme(); App.refresh(); } } catch (e) { toast('Fail sandaran tidak sah.', 'bad'); } }; rd.readAsText(f.files[0]); };
  f.click();
}
async function muatDemo() { if (!await confirmBox('Gantikan semua data dengan <b>data demo</b>?')) return; const d = demoData(); d.settings.adminPassword = GAS ? undefined : S.d.settings.adminPassword; d.settings.namaSekolah = S.d.settings.namaSekolah; d.settings.logo = S.d.settings.logo; d.settings.theme = S.d.settings.theme; if (await DB.replaceAll(d)) { toast('Data demo dimuatkan.'); App.refresh(); } }
async function kosongkanData() {
  if (!await confirmBox('Padam <b>SEMUA</b> data murid, guru, unit, laporan, program dan pencapaian? Tindakan ini tidak boleh dibatalkan.')) return;
  const d = normalize({ settings: Object.assign({}, S.d.settings, { adminPassword: GAS ? undefined : S.d.settings.adminPassword }) });
  if (await DB.replaceAll(d)) { toast('Semua data dikosongkan.'); App.refresh(); }
}
</script>
</body>
</html>
